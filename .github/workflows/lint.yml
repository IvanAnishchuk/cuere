name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      - run: uv sync --frozen --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff check (SARIF report)
        if: always()
        run: |
          mkdir -p .reports/lint
          uv run ruff check --output-format sarif \
            --output-file .reports/lint/ruff-check.sarif.json . || true

      - name: Ruff format check
        if: always()
        run: uv run ruff format --check .

      - name: Upload Ruff SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: .reports/lint/ruff-check.sarif.json
          category: ruff
        continue-on-error: true

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: .reports/lint/
          include-hidden-files: true
          retention-days: 14
