name: Type check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check (${{ matrix.checker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - checker: mypy
            command: mypy src/ tests/
          - checker: ty
            command: ty check
          - checker: basedpyright
            command: basedpyright
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      - run: uv sync --frozen --dev

      - name: Run ${{ matrix.checker }}
        # shell: bash enables pipefail so checker failures are not masked by tee.
        shell: bash
        run: |
          mkdir -p .reports/typecheck
          uv run ${{ matrix.command }} 2>&1 | tee ".reports/typecheck/${{ matrix.checker }}.txt"

      - name: Upload ${{ matrix.checker }} report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-${{ matrix.checker }}
          path: .reports/typecheck/${{ matrix.checker }}.txt
          include-hidden-files: true
          retention-days: 14
