name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - run: uv sync --frozen --dev

      # Informational only: records encode/render timings as a JSON artifact.
      # There is no regression threshold yet (the suite is the foundation for
      # one later, via pytest-benchmark's --benchmark-compare-fail). pytest-
      # benchmark does not create the --benchmark-json parent dir, so make it.
      - name: Run benchmarks
        run: |
          mkdir -p .reports/benchmark
          uv run pytest benchmarks/ --benchmark-only \
            --benchmark-json=.reports/benchmark/benchmark.json --no-cov

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: .reports/benchmark/
          include-hidden-files: true
          retention-days: 14
