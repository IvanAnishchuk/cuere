name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --frozen --dev

      # Informational only: records encode/render timings as a JSON artifact.
      # There is no regression threshold yet (the suite is the foundation for
      # one later, via pytest-benchmark's --benchmark-compare-fail). pytest-
      # benchmark does not create the --benchmark-json parent dir, so make it.
      - name: Run benchmarks
        run: |
          mkdir -p .reports/benchmark
          uv run pytest benchmarks/ --benchmark-only \
            --benchmark-json=.reports/benchmark/benchmark.json --no-cov

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: .reports/benchmark/
          include-hidden-files: true
          retention-days: 14
