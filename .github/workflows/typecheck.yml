name: Type check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check (${{ matrix.checker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - checker: mypy
            command: mypy src/ tests/
          - checker: ty
            command: ty check
          - checker: basedpyright
            command: basedpyright
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - run: uv sync --frozen --dev

      - name: Run ${{ matrix.checker }}
        # shell: bash enables pipefail so checker failures are not masked by tee.
        shell: bash
        run: |
          mkdir -p .reports/typecheck
          uv run ${{ matrix.command }} 2>&1 | tee ".reports/typecheck/${{ matrix.checker }}.txt"

      - name: Upload ${{ matrix.checker }} report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typecheck-${{ matrix.checker }}
          path: .reports/typecheck/${{ matrix.checker }}.txt
          include-hidden-files: true
          retention-days: 14
