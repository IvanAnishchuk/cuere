name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI instead of PyPI"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  # -------------------------------------------------------------------
  # Decide where (if anywhere) to publish from the event and tag, using
  # ANCHORED version matching so incidental letters in a tag or branch
  # name (e.g. "main" contains "a") can never misroute.
  # -------------------------------------------------------------------
  classify:
    name: Classify release target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      target: ${{ steps.c.outputs.target }}
      prerelease: ${{ steps.c.outputs.prerelease }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Determine publish target
        id: c
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TESTPYPI: ${{ inputs.testpypi }}
        run: |
          target=none
          prerelease=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$TESTPYPI" = "true" ]; then target=testpypi; prerelease=true; fi
          elif [ "$EVENT" = "push" ]; then
            ver="${REF_NAME#v}"
            if printf '%s' "$ver" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              target=pypi
            elif printf '%s' "$ver" | grep -qiE '^[0-9]+\.[0-9]+\.[0-9]+(\.?(a|b|c|rc|alpha|beta|dev)[0-9]*)+$'; then
              target=testpypi
              prerelease=true
            fi
          fi
          {
            echo "target=$target"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT ref=$REF_NAME -> target=$target prerelease=$prerelease"

  # -------------------------------------------------------------------
  # Build wheel + sdist with reproducible settings, generate SBOM,
  # attest provenance, and sign with sigstore.
  # -------------------------------------------------------------------
  build:
    name: Build & attest
    needs: classify
    if: needs.classify.outputs.target != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # fetch-depth: 0 is required: meson-python sdists need full git
      # metadata to assemble the source distribution.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Compute SOURCE_DATE_EPOCH from tag commit
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "${GITHUB_SHA}")" >> "$GITHUB_ENV"
          echo "PYTHONHASHSEED=0" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: |
          uv build
          ls -la dist/

      # Guard against a forgotten version bump: a tag vX.Y.Z must build an
      # X.Y.Z artifact. meson-python writes the meson.build version verbatim
      # into the wheel metadata, so a plain string compare to the tag catches a
      # stale meson.build. Runs whenever building from a tag (a push, or a
      # workflow_dispatch launched against a tag ref); a branch dispatch has no
      # tag to check.
      - name: Assert built version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag_version="${TAG#v}"
          built_version=$(unzip -p dist/*.whl '*.dist-info/METADATA' | sed -n 's/^Version: //p' | head -1)
          echo "tag=${tag_version} built=${built_version}"
          if [ "${tag_version}" != "${built_version}" ]; then
            echo "::error::tag version ${tag_version} != built package version ${built_version}; bump meson.build?"
            exit 1
          fi

      - name: Generate SBOM (CycloneDX)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv export --frozen --no-dev --extra image --format requirements-txt --no-emit-project \
            --output-file /tmp/requirements-release.txt
          uv tool run --from cyclonedx-bom cyclonedx-py requirements /tmp/requirements-release.txt \
            --output-format json \
            --output-file "dist/${GITHUB_REPOSITORY##*/}-${VERSION}-sbom.cdx.json"
          ls -la dist/

      - name: Compute artifact hashes
        id: hash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          HASHES=$(sha256sum *.whl *.tar.gz | base64 -w0)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"
          sha256sum *.whl *.tar.gz > "${GITHUB_REPOSITORY##*/}-${VERSION}-SHA256SUMS.txt"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

      - name: Attest SBOM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "sbom_path=dist/${GITHUB_REPOSITORY##*/}-${VERSION}-sbom.cdx.json" >> "$GITHUB_ENV"

      - name: Attest SBOM (upload)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.whl"
          sbom-path: "${{ env.sbom_path }}"

      - name: Sign artifacts with sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  # -------------------------------------------------------------------
  # SLSA Level 3 provenance generator (reusable workflow).
  # Pinned by tag, NOT SHA. The generator's generate-builder.sh
  # requires refs/tags/vX.Y.Z to fetch its pre-built binary -- commit
  # SHAs cause "Invalid ref" (exit 2). This is an accepted exception
  # to the SHA-pinning policy: tags can be retargeted upstream, but
  # the reusable workflow runs in an isolated environment the caller
  # cannot tamper with, and SLSA provenance is independently verifiable.
  # Requires contents: write even with upload-assets: false due to
  # static permission validation (slsa-github-generator#2044).
  # -------------------------------------------------------------------
  provenance:
    name: SLSA L3 provenance
    needs: build
    permissions:
      contents: write    # upload-assets job inside reusable workflow requires write
      id-token: write
      actions: read
    # The SLSA generator must be referenced by a semver tag (it verifies its own
    # ref); SHA-pinning it breaks provenance — hence the unpinned-uses ignore.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0  # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: false
      provenance-name: ${{ github.event.repository.name }}-${{ github.ref_name }}-provenance.intoto.jsonl

  # -------------------------------------------------------------------
  # Publish to PyPI via trusted publishing (OIDC, no password).
  # Only stable releases (no dev/a/b/c pre-release segments).
  # Protected by the `pypi` environment which requires manual approval.
  # -------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [classify, build]
    if: needs.classify.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/${{ github.event.repository.name }}/
    permissions:
      id-token: write      # OIDC for trusted publishing
      attestations: write  # PEP 740 publish attestations
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: release-dist/

      - name: Prepare dist/
        run: |
          mkdir -p dist
          cp release-dist/*.whl release-dist/*.tar.gz dist/
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
          verbose: true

  # -------------------------------------------------------------------
  # Publish to TestPyPI for pre-releases or manual dispatch.
  # -------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [classify, build]
    if: needs.classify.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/${{ github.event.repository.name }}/
    permissions:
      id-token: write      # OIDC for trusted publishing
      attestations: write  # PEP 740 publish attestations
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: release-dist/

      - name: Prepare dist/
        run: |
          mkdir -p dist
          cp release-dist/*.whl release-dist/*.tar.gz dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
          verbose: true

  # -------------------------------------------------------------------
  # Create GitHub Release with all artifacts (wheel, sdist, SBOM,
  # sigstore bundles, SLSA provenance).
  # -------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: [classify, build, provenance, publish-pypi, publish-testpypi]
    if: >-
      always()
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success'
      && needs.provenance.result == 'success'
      && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
      && (needs.publish-testpypi.result == 'success' || needs.publish-testpypi.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: release-dist/

      - name: Download SLSA provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ github.ref_name }}-provenance.intoto.jsonl
          path: release-dist/provenance/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              /^## \[/ { if (p) exit; if ($0 ~ "\\[" ver "\\]") p=1; next }
              p && /^\[[^][]+\]:[[:space:]]/ { exit }
              p { print }
            ' CHANGELOG.md > release-notes.md
          else
            : > release-notes.md
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release with assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "${{ github.event.repository.name }} ${{ steps.notes.outputs.version }}"
          body_path: release-notes.md
          draft: true
          prerelease: ${{ needs.classify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-dist/*.whl
            release-dist/*.tar.gz
            release-dist/*-sbom.cdx.json
            release-dist/*-SHA256SUMS.txt
            release-dist/*.sigstore.json
            release-dist/provenance/*-provenance.intoto.jsonl

      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
