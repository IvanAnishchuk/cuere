name: Type check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check (${{ matrix.checker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - checker: mypy
            command: mypy src/ tests/
          - checker: ty
            command: ty check
          - checker: basedpyright
            command: basedpyright
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true

      - run: uv sync --frozen --dev

      - name: Run ${{ matrix.checker }}
        # shell: bash enables pipefail so checker failures are not masked by tee.
        shell: bash
        run: |
          mkdir -p .reports/typecheck
          uv run ${{ matrix.command }} 2>&1 | tee ".reports/typecheck/${{ matrix.checker }}.txt"

      - name: Upload ${{ matrix.checker }} report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typecheck-${{ matrix.checker }}
          path: .reports/typecheck/${{ matrix.checker }}.txt
          include-hidden-files: true
          retention-days: 14
