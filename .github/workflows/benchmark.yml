name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - run: uv sync --frozen --dev

      # Informational only: records encode/render timings as a JSON artifact.
      # There is no regression threshold yet (the suite is the foundation for
      # one later, via pytest-benchmark's --benchmark-compare-fail). pytest-
      # benchmark does not create the --benchmark-json parent dir, so make it.
      - name: Run benchmarks
        run: |
          mkdir -p .reports/benchmark
          uv run pytest benchmarks/ --benchmark-only \
            --benchmark-json=.reports/benchmark/benchmark.json --no-cov

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: .reports/benchmark/
          include-hidden-files: true
          retention-days: 14
